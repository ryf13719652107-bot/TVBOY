<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>移动止盈 · TV量化机器人</title>
  <style>
    :root {
      --bg: #f1f5f9;
      --bg-accent: #e8f0fc;
      --card: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --accent: #2563eb;
      --ok: #059669;
      --err: #dc2626;
      --font: "Segoe UI", system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      --radius-lg: 14px;
      --shadow-card: 0 8px 28px rgba(15, 23, 42, 0.07);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font);
      font-size: 0.9rem;
      background: linear-gradient(165deg, var(--bg-accent) 0%, var(--bg) 42%, #f8fafc 100%);
      color: var(--text);
      line-height: 1.55;
    }
    .wrap { max-width: 640px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
    h1 { font-size: 1.45rem; margin: 0 0 0.25rem; }
    .sub { color: var(--muted); font-size: 0.82rem; margin-bottom: 1.25rem; }
    .sub a { color: var(--accent); }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1rem 1.25rem;
      margin-bottom: 1rem;
      box-shadow: var(--shadow-card);
    }
    .card h2 { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 0.75rem; }
    label { display: block; font-size: 0.82rem; color: #475569; margin-bottom: 0.35rem; font-weight: 500; }
    input, select, textarea {
      width: 100%;
      padding: 0.5rem 0.65rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 0.88rem;
    }
    .row { display: grid; gap: 0.65rem; grid-template-columns: 1fr 1fr; }
    @media (max-width: 560px) { .row { grid-template-columns: 1fr; } }
    button {
      padding: 0.55rem 1rem;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
    }
    button.secondary { background: #e2e8f0; color: #334155; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .pill { display: inline-block; padding: 0.1rem 0.45rem; border-radius: 4px; font-size: 0.7rem; font-weight: 600; }
    .pill.on { background: rgba(5, 150, 105, 0.12); color: var(--ok); }
    .pill.off { background: rgba(220, 38, 38, 0.1); color: var(--err); }
    .stat { font-size: 0.82rem; background: #eff6ff; border: 1px solid var(--border); border-radius: 8px; padding: 0.65rem; white-space: pre-wrap; word-break: break-word; }
    .hint { font-size: 0.78rem; color: var(--muted); margin-top: 0.5rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>移动止盈</h1>
    <p class="sub">币安 U 本位 / OKX 永续持仓监控 · 分档回撤止盈 / 止损 · <a href="/">返回控制台</a></p>

    <div class="card">
      <h2>访问密钥</h2>
      <label for="secret">DASHBOARD_SECRET（主密钥才可启动/停止）</label>
      <input id="secret" type="password" autocomplete="off" placeholder="与主控制台相同" />
      <div class="row" style="margin-top: 0.5rem;">
        <button type="button" class="secondary" id="btnSaveSecret">保存密钥</button>
        <button type="button" class="secondary" id="btnClearSecret">清除</button>
      </div>
      <p class="hint">密钥仅存浏览器 localStorage（键名 tv_binance_dashboard_secret）。飞书 Webhook 与黑名单亦存本机（与主站移动止盈页共用键名），填一次可长期保留。</p>
    </div>

    <div class="card">
      <h2>运行状态</h2>
      <div id="roleLine" class="hint">未鉴权</div>
      <div id="runStat" class="stat" style="margin-top: 0.5rem;">加载中…</div>
    </div>

    <div class="card">
      <h2>参数与启动</h2>
      <label for="accountSelect">交易账户（币安 / OKX）</label>
      <select id="accountSelect"></select>

      <div class="row" style="margin-top: 0.75rem;">
        <div>
          <label for="priceSource">浮盈计价</label>
          <select id="priceSource">
            <option value="mark">标记价（推荐）</option>
            <option value="last" selected>最新价（分档用标+新保守价）</option>
          </select>
        </div>
        <div>
          <label for="monitorInterval">有持仓时监控间隔（秒）</label>
          <input type="number" id="monitorInterval" min="1" max="120" step="1" value="1" />
        </div>
      </div>
      <div class="row" style="margin-top: 0.65rem;">
        <div>
          <label for="idleNoPosition">无持仓时轮询间隔（秒）</label>
          <input type="number" id="idleNoPosition" min="5" max="120" step="1" value="10" />
        </div>
        <div>
          <label for="stopLossPct">止损 %（相对开仓亏损）</label>
          <input type="number" id="stopLossPct" min="0.01" step="0.01" value="50" />
        </div>
      </div>
      <div class="row" style="margin-top: 0.65rem;">
        <div>
          <label for="takeProfitMode">止盈 / 平仓</label>
          <select id="takeProfitMode">
            <option value="market">市价</option>
            <option value="track" selected>条件限价追踪（STOP，GTC 限价）</option>
          </select>
        </div>
        <div>
          <label for="trackLimitOffsetBps">触发→委托价差（基点）</label>
          <input type="number" id="trackLimitOffsetBps" min="0" max="500" step="1" value="25" title="多头：限价低于触发价；过小易触发后不成交，建议≥20 基点。" />
        </div>
      </div>

      <div class="row" style="margin-top: 0.65rem;">
        <div>
          <label for="lowTrailProfit">低档盈利阈值 %</label>
          <input type="number" id="lowTrailProfit" min="0" step="0.1" value="0.9" />
        </div>
        <div>
          <label for="lowTrailStop">低档保护回撤线 %（浮盈低于此则平）</label>
          <input type="number" id="lowTrailStop" step="0.01" value="0.2" />
        </div>
      </div>

      <div class="row" style="margin-top: 0.65rem;">
        <div>
          <label for="firstTrailProfit">第一档移动止盈阈值 %</label>
          <input type="number" id="firstTrailProfit" min="0" step="0.1" value="1" />
        </div>
        <div>
          <label for="trailStopLossPct">第一档回撤比例（最高盈利×(1-此值)）</label>
          <input type="number" id="trailStopLossPct" min="0.01" max="1" step="0.01" value="0.2" />
        </div>
      </div>

      <div class="row" style="margin-top: 0.65rem;">
        <div>
          <label for="secondTrailProfit">第二档移动止盈阈值 %</label>
          <input type="number" id="secondTrailProfit" min="0" step="0.1" value="1.5" />
        </div>
        <div>
          <label for="higherTrailStopPct">第二档回撤比例</label>
          <input type="number" id="higherTrailStopPct" min="0.01" max="1" step="0.01" value="0.3" />
        </div>
      </div>

      <label for="feishuWebhook" style="margin-top: 0.75rem;">飞书 Webhook（可选）</label>
      <input id="feishuWebhook" type="text" placeholder="https://open.feishu.cn/open-apis/bot/v2/hook/..." />

      <label for="blacklist" style="margin-top: 0.65rem;">黑名单交易对（可选，逗号或换行分隔，如 BTCUSDT）</label>
      <textarea id="blacklist" rows="2" placeholder="留空表示不过滤"></textarea>

      <p class="hint">无仓时按「无持仓间隔」只拉仓位；有仓时按「有持仓间隔」；选最新价时每个监控标的额外请求 ticker。</p>

      <div class="row" style="margin-top: 0.75rem;">
        <button type="button" id="btnStart" disabled>启动移动止盈</button>
        <button type="button" class="secondary" id="btnStop" disabled>停止</button>
      </div>
      <p id="formHint" class="hint"></p>
    </div>
  </div>

  <script>
    const KEY = "tv_binance_dashboard_secret";
    const TRAIL_FEISHU_LS = "tv_binance_trailing_feishu_webhook";
    const TRAIL_BLACKLIST_LS = "tv_binance_trailing_blacklist";
    const secretEl = document.getElementById("secret");
    const accountSelect = document.getElementById("accountSelect");
    const runStat = document.getElementById("runStat");
    const roleLine = document.getElementById("roleLine");
    const btnStart = document.getElementById("btnStart");
    const btnStop = document.getElementById("btnStop");
    const formHint = document.getElementById("formHint");
    let dashboardRole = null;
    let pollTimer = null;

    function getSecret() {
      return (secretEl.value || "").trim();
    }
    function loadTrailingFormPrefs() {
      const h = localStorage.getItem(TRAIL_FEISHU_LS);
      const fe = document.getElementById("feishuWebhook");
      if (fe && h !== null) fe.value = h;
      const bls = localStorage.getItem(TRAIL_BLACKLIST_LS);
      const bl = document.getElementById("blacklist");
      if (bl && bls !== null) bl.value = bls;
    }
    function saveTrailingFormPrefs() {
      const fe = document.getElementById("feishuWebhook");
      if (fe) {
        const v = fe.value.trim();
        if (v) localStorage.setItem(TRAIL_FEISHU_LS, v);
        else localStorage.removeItem(TRAIL_FEISHU_LS);
      }
      const bl = document.getElementById("blacklist");
      if (bl) {
        const v = bl.value.trim();
        if (v) localStorage.setItem(TRAIL_BLACKLIST_LS, v);
        else localStorage.removeItem(TRAIL_BLACKLIST_LS);
      }
    }
    function loadSecret() {
      secretEl.value = localStorage.getItem(KEY) || "";
      loadTrailingFormPrefs();
      refreshAuth();
    }
    function saveSecret() {
      localStorage.setItem(KEY, getSecret());
      refreshAuth();
    }
    function authHeaders() {
      const s = getSecret();
      if (!s) throw new Error("请先填写并保存密钥");
      return { "Content-Type": "application/json", "X-TV-Secret": s };
    }

    async function refreshAuth() {
      dashboardRole = null;
      if (!getSecret()) {
        roleLine.textContent = "未填写密钥";
        btnStart.disabled = true;
        btnStop.disabled = true;
        return;
      }
      try {
        const r = await fetch("/api/status", { headers: authHeaders() });
        const d = await r.json();
        if (!d.ok) throw new Error(JSON.stringify(d));
        dashboardRole = d.auth_role || null;
        roleLine.innerHTML =
          dashboardRole === "admin"
            ? '<span class="pill on">主密钥</span> 可启动/停止'
            : dashboardRole === "viewer"
              ? '<span class="pill off">访客只读</span> 仅可查看状态'
              : '<span class="pill off">密钥无效</span>';
        btnStart.disabled = dashboardRole !== "admin";
        btnStop.disabled = dashboardRole !== "admin";
      } catch (e) {
        roleLine.textContent = "鉴权失败: " + e.message;
        btnStart.disabled = true;
        btnStop.disabled = true;
      }
    }

    async function loadAccounts() {
      if (!getSecret()) {
        accountSelect.innerHTML = '<option value="">请先保存密钥</option>';
        return;
      }
      try {
        const r = await fetch("/api/accounts", { headers: authHeaders() });
        const d = await r.json();
        if (!d.ok) throw new Error(d.error || JSON.stringify(d));
        const list = d.accounts || [];
        const opts = list
          .filter((a) => {
            const ex = (a.exchange || "binance").toLowerCase();
            return a.id && (ex === "binance" || ex === "okx");
          })
          .map((a) => {
            const id = String(a.id).replace(/"/g, "&quot;");
            const name = (a.remark || a.id).replace(/</g, "&lt;");
            return `<option value="${id}">${name}</option>`;
          });
        accountSelect.innerHTML =
          opts.length > 0
            ? opts.join("")
            : '<option value="">无币安/OKX 账户（请在主控制台添加）</option>';
      } catch (e) {
        accountSelect.innerHTML = '<option value="">加载失败</option>';
      }
    }

    function pickTaskForSelected(tasks) {
      const id = accountSelect.value;
      if (!id) return null;
      return (tasks || []).find((t) => String(t.account_id) === id) || null;
    }

    async function refreshStatus() {
      if (!getSecret()) {
        runStat.textContent = "请填写访问密钥";
        return;
      }
      try {
        const r = await fetch("/api/trailing-stop/status", { headers: authHeaders() });
        const d = await r.json();
        if (!d.ok) throw new Error(d.error || JSON.stringify(d));
        const tasks = d.tasks || [];
        const cur = pickTaskForSelected(tasks);
        if (!accountSelect.value) {
          runStat.textContent = "请选择账户";
          return;
        }
        if (!cur) {
          runStat.textContent = "当前账户未运行移动止盈。";
          return;
        }
        const run = cur.running ? "运行中" : "已停止";
        const p = cur.params || {};
        const px = p.use_last_price === true ? "最新价" : "标记价";
        const tpm = p.take_profit_mode;
        const eat = p.exchange_algo_type || "stop_market";
        let cm = "市价";
        if (tpm === "track" || p.trailing_exec === "exchange_stop") {
          cm = eat === "stop_limit" ? "条件限价(STOP)" : "条件市价(STOP_MARKET)";
        } else if (
          tpm === "limit_ioc" ||
          p.close_mode === "limit_ioc" ||
          p.close_mode === "limit"
        ) {
          cm = "限价IOC";
        }
        runStat.textContent =
          `状态: ${run}\n` +
          `开始时间: ${cur.started_at || "—"}\n` +
          (cur.stopped_at ? `结束: ${cur.stopped_at}\n` : "") +
          `计价: ${px} · 平仓: ${cm} · 有仓=${p.monitor_interval ?? "—"}s · 空仓=${p.idle_no_position_sec ?? "—"}s · 止损=${p.stop_loss_pct ?? "—"}%\n` +
          `最近: ${cur.last_status || "—"}`;
      } catch (e) {
        runStat.textContent = "查询失败: " + e.message;
      }
    }

    async function doStart() {
      formHint.textContent = "";
      if (dashboardRole !== "admin") {
        alert("需要主密钥才能启动");
        return;
      }
      const account_id = accountSelect.value;
      if (!account_id) {
        alert("请选择账户");
        return;
      }
      const num = (id) => {
        const v = parseFloat(document.getElementById(id).value);
        return Number.isFinite(v) ? v : NaN;
      };
      const body = {
        secret: getSecret(),
        account_id,
        use_last_price: (document.getElementById("priceSource")?.value || "mark") === "last",
        take_profit_mode: document.getElementById("takeProfitMode")?.value || "track",
        limit_offset_bps: num("trackLimitOffsetBps"),
        idle_no_position_sec: num("idleNoPosition"),
        monitor_interval: num("monitorInterval"),
        stop_loss_pct: num("stopLossPct"),
        low_trail_stop_loss_pct: num("lowTrailStop"),
        trail_stop_loss_pct: num("trailStopLossPct"),
        higher_trail_stop_loss_pct: num("higherTrailStopPct"),
        low_trail_profit_threshold: num("lowTrailProfit"),
        first_trail_profit_threshold: num("firstTrailProfit"),
        second_trail_profit_threshold: num("secondTrailProfit"),
        feishu_webhook: document.getElementById("feishuWebhook").value.trim() || null,
        blacklist: document.getElementById("blacklist").value.trim() || null,
      };
      for (const k of Object.keys(body)) {
        if (
          k === "secret" ||
          k === "account_id" ||
          k === "feishu_webhook" ||
          k === "blacklist" ||
          k === "use_last_price" ||
          k === "take_profit_mode"
        )
          continue;
        if (typeof body[k] === "number" && !Number.isFinite(body[k])) {
          formHint.textContent = "请填写有效的数字参数";
          return;
        }
      }
      if (
        !Number.isFinite(body.limit_offset_bps) ||
        body.limit_offset_bps < 0 ||
        body.limit_offset_bps > 500
      ) {
        formHint.textContent = "触发→委托价差基点须在 0～500";
        return;
      }
      if (body.trail_stop_loss_pct <= 0 || body.trail_stop_loss_pct > 1 || body.higher_trail_stop_loss_pct <= 0 || body.higher_trail_stop_loss_pct > 1) {
        formHint.textContent = "两档回撤比例须在 0～1 之间（如 0.3）";
        return;
      }
      if (body.idle_no_position_sec < 5 || body.idle_no_position_sec > 120) {
        formHint.textContent = "无持仓轮询间隔须在 5～120 秒之间";
        return;
      }
      try {
        const r = await fetch("/api/trailing-stop/start", {
          method: "POST",
          headers: authHeaders(),
          body: JSON.stringify(body),
        });
        const d = await r.json();
        if (!d.ok) throw new Error(d.error || d.hint || JSON.stringify(d));
        formHint.textContent = "已启动";
        saveTrailingFormPrefs();
        refreshStatus();
      } catch (e) {
        formHint.textContent = "启动失败: " + e.message;
      }
    }

    async function doStop() {
      formHint.textContent = "";
      if (dashboardRole !== "admin") {
        alert("需要主密钥才能停止");
        return;
      }
      const account_id = accountSelect.value;
      if (!account_id) {
        alert("请选择账户");
        return;
      }
      try {
        const r = await fetch("/api/trailing-stop/stop", {
          method: "POST",
          headers: authHeaders(),
          body: JSON.stringify({ secret: getSecret(), account_id }),
        });
        const d = await r.json();
        if (!d.ok) throw new Error(d.error || JSON.stringify(d));
        formHint.textContent = "已停止";
        refreshStatus();
      } catch (e) {
        formHint.textContent = "停止失败: " + e.message;
      }
    }

    document.getElementById("btnSaveSecret").addEventListener("click", () => {
      saveSecret();
      loadAccounts();
    });
    document.getElementById("btnClearSecret").addEventListener("click", () => {
      localStorage.removeItem(KEY);
      secretEl.value = "";
      refreshAuth();
      loadAccounts();
      runStat.textContent = "—";
    });
    btnStart.addEventListener("click", doStart);
    btnStop.addEventListener("click", doStop);
    accountSelect.addEventListener("change", refreshStatus);
    document.getElementById("feishuWebhook")?.addEventListener("blur", saveTrailingFormPrefs);
    document.getElementById("blacklist")?.addEventListener("blur", saveTrailingFormPrefs);

    loadSecret();
    loadAccounts().then(refreshStatus);
    pollTimer = setInterval(refreshStatus, 2500);
  </script>
</body>
</html>
